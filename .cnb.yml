main:
  push:
    - docker:
        image: node:22-alpine
      stages:
        - name: syntax and regression tests
          script: npm test
$:
  pull_request:
    - docker:
        image: node:22-alpine
      stages:
        - name: syntax and regression tests
          script: npm test
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: glm-5.3-flash
  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: glm-5.3-flash
