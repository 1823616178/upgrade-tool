<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI Code Tool Updater">
  <defs>
    <!-- 背景渐变：深蓝到 navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <!-- 主符号渐变：蓝到绿，对应 primary / success 主题色 -->
    <linearGradient id="symbol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <!-- 高光渐变 -->
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 软阴影 -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角底 -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg)"/>
  <!-- 顶部高光 -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#hi)"/>
  <!-- 细边 -->
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" ry="111.5" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- 代码尖角 + 上升箭头 组合 -->
  <g filter="url(#soft)">
    <!-- 左尖角 -->
    <path d="M150 176 L86 256 L150 336"
          fill="none" stroke="url(#symbol)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 右尖角 -->
    <path d="M362 176 L426 256 L362 336"
          fill="none" stroke="url(#symbol)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 中央上升箭头（更新/升级意象） -->
    <g transform="translate(256 256)">
      <!-- 箭头杆 -->
      <rect x="-18" y="-60" width="36" height="120" rx="14" fill="url(#symbol)"/>
      <!-- 箭头头 -->
      <path d="M0 -104 L64 -40 L36 -40 L36 -28 L-36 -28 L-36 -40 L-64 -40 Z"
            fill="url(#symbol)"/>
    </g>
  </g>

  <!-- 底部小圆点装饰（版本指示） -->
  <g>
    <circle cx="220" cy="400" r="8" fill="#3b82f6"/>
    <circle cx="256" cy="400" r="8" fill="#22c55e"/>
    <circle cx="292" cy="400" r="8" fill="#f59e0b"/>
  </g>
</svg>
