<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Code Tool Updater</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <h1>AI Code Tool Updater</h1>
        <p class="subtitle">检测并一键更新 Kimi / Claude / Codex / OpenCode / CodeBuddy / Qwen / Gemini</p>
      </div>
      <div class="header-actions">
        <button id="btn-check" class="btn btn-primary">
          <span class="icon">🔍</span> 检测版本
        </button>
        <button id="btn-update-all" class="btn btn-success" disabled>
          <span class="icon">🚀</span> 一键更新全部
        </button>
        <button id="btn-admin" class="btn btn-ghost">
          <span class="icon">⚠️</span> 管理员提示
        </button>
      </div>
    </header>

    <main class="main">
      <div id="tools-grid" class="tools-grid">
        <!-- 工具卡片由 JS 动态生成 -->
      </div>

      <section class="log-section">
        <div class="log-header">
          <h2>实时日志</h2>
          <button id="btn-clear-log" class="btn btn-ghost btn-sm">清空</button>
        </div>
        <div id="log-container" class="log-container">
          <div class="log-empty">点击「检测版本」开始</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>版本检测基于 npm view，更新基于 npm install -g</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
