<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" />
    <title>AI Code Tool Updater</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app">
        <!-- 背景光效装饰 -->
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>

        <!-- 环境异常警告横幅（默认隐藏） -->
        <div id="env-banner" class="env-banner" style="display: none;">
            <span class="env-banner-icon">⚠️</span>
            <span id="env-banner-text">环境检测中...</span>
            <button id="btn-dismiss-env" class="btn btn-ghost btn-sm">关闭</button>
        </div>

        <header class="header">
            <div class="header-top">
                <div class="header-left">
                    <div class="header-logo">
                        <span class="logo-icon">✦</span>
                    </div>
                    <div>
                        <h1>AI Code Tool Updater</h1>
                        <p class="subtitle">检测并一键更新 AI 编程助手工具</p>
                    </div>
                </div>
                <div class="header-meta">
                    <div class="registry-selector">
                        <label class="registry-label">🌐 镜像源</label>
                        <div class="select-wrapper">
                            <select id="select-registry" class="select-registry">
                                <!-- 由 JS 动态填充 -->
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-toolbar">
                <div class="toolbar-group toolbar-group-main">
                    <button id="btn-check" class="btn btn-primary">
                        <span class="icon">🔍</span> 检测版本
                    </button>
                    <button id="btn-update-all" class="btn btn-success" disabled>
                        <span class="icon">🚀</span> 一键更新全部
                    </button>
                    <button id="btn-install-all" class="btn btn-warning" disabled>
                        <span class="icon">📦</span> 一键安装全部
                    </button>
                </div>
                <div class="toolbar-divider"></div>
                <div class="toolbar-group toolbar-group-util">
                    <button id="btn-open-powershell" class="btn btn-tool" title="一键打开 PowerShell 窗口">
                        <span class="icon">💻</span> PowerShell
                    </button>
                    <button id="btn-export-report" class="btn btn-tool" title="导出全部工具版本报告">
                        <span class="icon">📊</span> 版本报告
                    </button>
                    <button id="btn-install-agyyolo" class="btn btn-tool" title="将 agyyolo 函数永久配置到 PowerShell">
                        <span class="icon">⚡</span> 配置 yolo
                    </button>
                    <button id="btn-remove-agyyolo" class="btn btn-tool" title="撤销本工具写入的 agyyolo Profile 配置">
                        <span class="icon">↩</span> 撤销 yolo
                    </button>
                    <button id="btn-add-tool" class="btn btn-tool" title="添加自定义工具">
                        <span class="icon">➕</span> 添加工具
                    </button>
                    <button id="btn-settings" class="btn btn-tool" title="应用设置">
                        <span class="icon">⚙️</span> 设置
                    </button>
                    <button id="btn-admin" class="btn btn-tool" title="查看管理员权限说明">
                        <span class="icon">⚠️</span> 权限提示
                    </button>
                </div>
            </div>
        </header>

        <main class="main">
            <div id="stats-bar" class="stats-bar" style="display: none;">
                <span class="stat-chip stat-chip-update" data-filter="update" title="点击过滤可更新工具">🚀 <b id="stat-update">0</b> 可更新</span>
                <span class="stat-chip stat-chip-install" data-filter="install" title="点击过滤未安装工具">📦 <b id="stat-install">0</b> 未安装</span>
                <span class="stat-chip stat-chip-latest" data-filter="latest" title="点击过滤最新工具">✅ <b id="stat-latest">0</b> 最新</span>
                <span class="stat-chip stat-chip-error" data-filter="error" title="点击过滤检测失败工具">⚠️ <b id="stat-error">0</b> 检测失败</span>
                <span class="stat-chip stat-chip-unsupported" data-filter="unsupported" title="点击过滤当前平台不支持的工具">🚫 <b id="stat-unsupported">0</b> 平台不支持</span>
            </div>

            <div id="tools-grid" class="tools-grid">
                <!-- 工具卡片由 JS 动态生成 -->
            </div>

            <section class="log-section">
                <!-- 日志面板高度拖拽条：贴在日志区顶部边缘 -->
                <div id="log-resizer" class="log-resizer" role="separator" aria-orientation="horizontal"
                    aria-label="调整日志面板高度" aria-valuemin="150" title="拖动调整日志高度，双击恢复默认" tabindex="0"></div>
                <div class="log-header">
                    <h2>实时日志</h2>
                    <div class="log-filters">
                        <select id="log-filter-level" class="log-filter-select" title="按级别筛选">
                            <option value="">全部级别</option>
                            <option value="info">info</option>
                            <option value="success">success</option>
                            <option value="error">error</option>
                            <option value="start">start</option>
                            <option value="data">data</option>
                        </select>
                        <select id="log-filter-tool" class="log-filter-select" title="按工具筛选">
                            <option value="">全部工具</option>
                        </select>
                        <input id="log-search" type="text" class="log-search-input" placeholder="搜索日志..." />
                    </div>
                    <div class="log-actions">
                        <button id="btn-copy-log" class="btn btn-ghost btn-sm" title="复制日志">📋 复制</button>
                        <button id="btn-export-log" class="btn btn-ghost btn-sm" title="导出日志">💾 导出</button>
                        <button id="btn-clear-log" class="btn btn-ghost btn-sm">清空</button>
                    </div>
                </div>
                <div id="log-container" class="log-container">
                    <div class="log-empty">点击「检测版本」开始</div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-env">
                <span id="env-node" class="env-tag">Node: —</span>
                <span id="env-npm" class="env-tag">npm: —</span>
                <span id="env-os" class="env-tag">OS: —</span>
            </div>
            <span class="footer-hint">版本比较使用 semver · 关闭窗口可最小化到托盘</span>
        </footer>
    </div>

    <!-- 添加自定义工具的模态框 -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>添加自定义工具</h3>
                <button id="btn-modal-close" class="btn-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>工具名称 <span class="required">*</span></label>
                    <input id="input-tool-name" type="text" class="form-input" placeholder="例如：My CLI Tool" />
                </div>
                <div class="form-group">
                    <label>npm 包名 <span class="required">*</span></label>
                    <input id="input-tool-pkg" type="text" class="form-input" placeholder="例如：@scope/my-cli" />
                </div>
                <div class="form-group">
                    <label>CLI 命令名 <span class="required">*</span></label>
                    <input id="input-tool-cmd" type="text" class="form-input" placeholder="例如：mycli" />
                </div>
                <div class="form-group">
                    <label>版本参数</label>
                    <input id="input-tool-version-arg" type="text" class="form-input" placeholder="默认 --version"
                        value="--version" />
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-modal-cancel" class="btn btn-ghost">取消</button>
                <button id="btn-modal-save" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 应用设置模态框 -->
    <div id="settings-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>应用设置</h3>
                <button id="btn-settings-close" class="btn-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>后台版本检测间隔</label>
                    <select id="select-bg-check" class="form-input form-select">
                        <option value="0">关闭</option>
                        <option value="1">每 1 小时</option>
                        <option value="2">每 2 小时</option>
                        <option value="4">每 4 小时</option>
                        <option value="6">每 6 小时</option>
                        <option value="12">每 12 小时</option>
                        <option value="24">每 24 小时</option>
                    </select>
                    <p class="form-hint">有新版本时通过系统通知提醒</p>
                </div>
                <div class="form-group form-row">
                    <label class="checkbox-label" for="check-minimize-tray">
                        <input id="check-minimize-tray" type="checkbox" />
                        <span>关闭窗口时最小化到系统托盘</span>
                    </label>
                </div>
                <div class="form-group form-row">
                    <label class="checkbox-label" for="check-open-at-login">
                        <input id="check-open-at-login" type="checkbox" />
                        <span>开机自动启动（仅安装版生效）</span>
                    </label>
                </div>
                <div class="form-group form-row">
                    <label class="checkbox-label" for="check-start-minimized">
                        <input id="check-start-minimized" type="checkbox" />
                        <span>启动时最小化到系统托盘</span>
                    </label>
                </div>
                <!-- 镜像源测速 -->
                <div class="form-group">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <label style="margin:0">🏃 镜像源延迟测试</label>
                        <button id="btn-ping-registry" class="btn btn-tool btn-sm" type="button">🚀 测速</button>
                        <button id="btn-auto-registry" class="btn btn-tool btn-sm" type="button">⚡ 自动选最快</button>
                    </div>
                    <div id="registry-speed-results" class="ping-results" style="display:none;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-settings-cancel" class="btn btn-ghost">取消</button>
                <button id="btn-settings-save" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 自定义镜像源模态框 -->
    <div id="registry-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>自定义镜像源</h3>
                <button id="btn-registry-close" class="btn-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>镜像源 URL <span class="required">*</span></label>
                    <input id="input-registry-url" type="text" class="form-input"
                        placeholder="例如：https://registry.npmmirror.com/" />
                    <p class="form-hint">仅支持 http:// 或 https:// 地址</p>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-registry-cancel" class="btn btn-ghost">取消</button>
                <button id="btn-registry-save" class="btn btn-primary">使用此源</button>
            </div>
        </div>
    </div>

    <!-- 自定义确认弹框（替代原生 confirm()，样式与整体 UI 一致） -->
    <div id="confirm-overlay" class="modal-overlay" style="display: none;">
        <div class="modal modal-confirm">
            <div class="modal-header">
                <h3 id="confirm-title">确认操作</h3>
                <button id="btn-confirm-close" class="btn-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirm-message" class="confirm-message"></p>
            </div>
            <div class="modal-footer">
                <button id="btn-confirm-cancel" class="btn btn-ghost">取消</button>
                <button id="btn-confirm-ok" class="btn btn-primary">确认</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
